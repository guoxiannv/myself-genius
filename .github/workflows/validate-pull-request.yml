name: Validate pull request

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and source branch
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          title_pattern='^\[(frontend|runner|sdk|global)\][[:space:]]+[^[:space:]].*$'
          branch_pattern='^(frontend|runner|sdk|global)/[^/[:space:]][^[:space:]]*$'

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "::error::Invalid PR title: $PR_TITLE"
            echo "Expected format: [frontend|runner|sdk|global] description"
            exit 1
          fi

          if [[ ! "$PR_BRANCH" =~ $branch_pattern ]]; then
            echo "::error::Invalid PR source branch: $PR_BRANCH"
            echo "Expected format: frontend/*, runner/*, sdk/*, or global/*"
            exit 1
          fi

          echo "PR title and source branch are valid."
